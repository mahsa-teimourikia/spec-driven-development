name: AI-2500 parallel delivery validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-2500-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 curriculum/intermediate/11-multi-repository-parallel-agent-delivery/northstar-parallel-agents/lab.py
      - run: python3 -m unittest tests/test_course_21.py -v
