<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="650" viewBox="0 0 1680 650" role="img" aria-labelledby="title desc">
<title id="title">A proportional, evidence-bound bug-fix workflow</title>
<desc id="desc">A bug report enters trusted risk triage, then reproduction and discriminating experiments, a bounded agent patch, and independent diff and oracle verification. A clean result becomes eligible for integration review. Verification failures return to investigation. Merge and deployment authority remain outside this workflow.</desc>
<rect width="1680" height="650" fill="#F7F9FC"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52606D"/></marker></defs>
<text x="50" y="66" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">A proportional, evidence-bound bug fix</text>
<text x="50" y="104" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="18">Risk selects the workflow. Evidence—not an agent claim—establishes review eligibility.</text>
<rect x="50" y="220" width="220" height="180" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="3"/>
<text x="160.0" y="295.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Bug report</text>
<text x="160.0" y="325.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">observation, not truth</text>
<rect x="320" y="220" width="220" height="180" rx="14" fill="#FFF1DF" stroke="#D97706" stroke-width="3"/>
<text x="430.0" y="295.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Trusted risk triage</text>
<text x="430.0" y="325.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">select workflow mode</text>
<rect x="590" y="220" width="220" height="180" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="3"/>
<text x="700.0" y="295.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Reproduce + discriminate</text>
<text x="700.0" y="325.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">confirm root cause</text>
<rect x="860" y="220" width="220" height="180" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="3"/>
<text x="970.0" y="295.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Bounded agent patch</text>
<text x="970.0" y="325.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">minimal sufficient change</text>
<rect x="1130" y="220" width="220" height="180" rx="14" fill="#E5F7F6" stroke="#087F7B" stroke-width="3"/>
<text x="1240.0" y="295.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Independent verification</text>
<text x="1240.0" y="325.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">diff + oracle + red/green</text>
<rect x="1400" y="220" width="220" height="180" rx="14" fill="#E5F7F6" stroke="#087F7B" stroke-width="3"/>
<text x="1510.0" y="295.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Integration review</text>
<text x="1510.0" y="325.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">eligible, not merged</text>
<polyline points="270,310 320,310" fill="none" stroke="#52606D" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="540,310 590,310" fill="none" stroke="#52606D" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="810,310 860,310" fill="none" stroke="#52606D" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1080,310 1130,310" fill="none" stroke="#52606D" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1350,310 1400,310" fill="none" stroke="#52606D" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1240,400 1240,515 700,515 700,400" fill="none" stroke="#087F7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="970" y="548" text-anchor="middle" fill="#087F7B" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">mismatch or stale evidence → investigate again</text>
<text x="835" y="615" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="15">Merge and deployment remain separate trusted-authority decisions.</text>
</svg>
