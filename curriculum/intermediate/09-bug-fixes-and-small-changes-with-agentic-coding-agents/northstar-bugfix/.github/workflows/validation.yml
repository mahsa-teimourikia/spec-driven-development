name: Course 19 reference validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "curriculum/intermediate/09-bug-fixes-and-small-changes-with-agentic-coding-agents/**"
      - "tests/test_course_19.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run executable lab
        run: python3 curriculum/intermediate/09-bug-fixes-and-small-changes-with-agentic-coding-agents/northstar-bugfix/lab.py
      - name: Run focused tests
        run: python3 -m unittest tests/test_course_19.py -v
