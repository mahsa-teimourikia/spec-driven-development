<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="680" viewBox="0 0 1680 680" role="img" aria-labelledby="title desc">
<title id="title">Contract-first coordination across independently versioned repositories</title>
<desc id="desc">A parent change and canonical contract feed two bounded repository work units. Their exact Git commits flow into trusted compatibility and integration verification, then become eligible for integration review. A failed check returns to replanning. Deployment authority remains outside the workflow.</desc>
<rect width="1680" height="680" fill="#F7F9FC"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52606D"/></marker></defs>
<text x="50" y="62" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Contract-first multi-repository delivery</text>
<text x="50" y="100" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="18">Parallel work begins only after contract approval; system evidence binds exact repository commits.</text>
<polyline points="270,305.0 295.0,305.0 295.0,305.0 320,305.0" fill="none" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="540,305.0 565.0,305.0 565.0,215.0 590,215.0" fill="none" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="540,305.0 565.0,305.0 565.0,435.0 590,435.0" fill="none" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="810,215.0 860.0,215.0 860.0,305.0 910,305.0" fill="none" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="810,435.0 860.0,435.0 860.0,305.0 910,305.0" fill="none" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1160,305.0 1185.0,305.0 1185.0,305.0 1210,305.0" fill="none" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1430,305.0 1455.0,305.0 1455.0,305.0 1480,305.0" fill="none" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="220" width="220" height="170" rx="14" fill="#FFF1DF" stroke="#D97706" stroke-width="3"/>
<text x="160.0" y="295" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Parent change</text>
<text x="160.0" y="325" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="14">requirements + authority</text>
<rect x="320" y="220" width="220" height="170" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="3"/>
<text x="430.0" y="295" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Canonical contract</text>
<text x="430.0" y="325" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="14">owner-approved revision</text>
<rect x="590" y="130" width="220" height="170" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="3"/>
<text x="700.0" y="205" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">AI Service AWU</text>
<text x="700.0" y="235" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="14">exact base commit</text>
<rect x="590" y="350" width="220" height="170" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="3"/>
<text x="700.0" y="425" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Review Service AWU</text>
<text x="700.0" y="455" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="14">tolerant consumer</text>
<rect x="910" y="220" width="250" height="170" rx="14" fill="#E5F7F6" stroke="#087F7B" stroke-width="3"/>
<text x="1035.0" y="295" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Trusted integration</text>
<text x="1035.0" y="325" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="14">matrix + failure paths</text>
<rect x="1210" y="220" width="220" height="170" rx="14" fill="#E5F7F6" stroke="#087F7B" stroke-width="3"/>
<text x="1320.0" y="295" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Revision manifest</text>
<text x="1320.0" y="325" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="14">five full Git SHAs</text>
<rect x="1480" y="220" width="150" height="170" rx="14" fill="#E5F7F6" stroke="#087F7B" stroke-width="3"/>
<text x="1555.0" y="295" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Integration review</text>
<text x="1555.0" y="325" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="14">eligible, not deployed</text>
<text x="840" y="620" text-anchor="middle" fill="#52606D" font-family="Inter, Arial, sans-serif" font-size="16">Merge, deployment, activation, and contract retirement remain separate accountable decisions.</text>
</svg>
