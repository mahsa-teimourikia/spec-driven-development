name: Validate Course 20 fixture

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 lab.py
      - run: python3 -m unittest discover -s ../../../../tests -p 'test_course_20.py' -v
