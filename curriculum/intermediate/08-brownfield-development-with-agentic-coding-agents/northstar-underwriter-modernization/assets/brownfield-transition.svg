<polyline points="1510,375 1550,375" fill="none" stroke="#52606D" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1385,470 1385,570 460,570 460,470" fill="none" stroke="#087F7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="920" y="558" text-anchor="middle" fill="#087F7B" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">divergence, stale evidence, or unknown → owner-controlled revision</text>
<polyline points="1605,435 1605,650" fill="none" stroke="#D97706" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="1558" y="555" text-anchor="middle" fill="#D97706" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">not implied</text>
</svg>
