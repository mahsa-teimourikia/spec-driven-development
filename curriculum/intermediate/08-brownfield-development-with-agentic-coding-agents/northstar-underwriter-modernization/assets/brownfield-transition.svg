<text x="1385.0" y="375.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">compatibility + invariants</text>
<text x="1385.0" y="403.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">migration + rollback</text>
<rect x="1550" y="315" width="110" height="120" rx="14" fill="#E5F7F6" stroke="#087F7B" stroke-width="3"/>
<text x="1605.0" y="361.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Integration</text>
<text x="1605.0" y="389.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">review eligible</text>
<rect x="1310" y="650" width="350" height="100" rx="14" fill="#FFF1DF" stroke="#D97706" stroke-width="3"/>
<text x="1485.0" y="686.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Merge · deployment · retirement</text>
<text x="1485.0" y="714.0" text-anchor="middle" fill="#16324F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500">separate trusted authority</text>
