<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1640 960">
<title id="title">Requirement authority, specialization, and enforcement</title>
<desc id="desc">Four-stage diagram. Enterprise and domain policy sources feed a project policy manifest. Versioned relationships connect the manifest to project specializations and feature behavior. Machine controls enforce the requirements, while a bounded coding agent reads effective context but cannot write policy or exception sources. Policy changes propagate back through the relationship graph for impact review.</desc>
<defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16324F" flood-opacity="0.09"/></filter>
        <marker id="arrow-authority" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker>
        <marker id="arrow-relationship" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087F7B"/></marker>
        <marker id="arrow-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#238636"/></marker>
        <marker id="arrow-stop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
        <style>text{font-family:Inter,Arial,sans-serif;fill:#16324F}.title{font-size:30px;font-weight:750}.subtitle{font-size:16px;fill:#52606D}.group{font-size:14px;font-weight:750;letter-spacing:1.4px;fill:#52606D}.label{font-size:17px;font-weight:700}.note{font-size:13px;fill:#52606D}.edge{font-size:13px;font-weight:650;fill:#52606D;paint-order:stroke;stroke:#F7F9FC;stroke-width:8px}</style>
        </defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="50" y="58" class="title">Requirement authority, specialization, and enforcement</text>
<text x="50" y="90" class="subtitle">Authority stays with its owner; local layers specialize, implement, evidence, and stop on drift.</text>
<g filter="url(#shadow)"><rect x="50" y="145" width="340" height="730" rx="18" fill="#FFFFFF" stroke="#D7DEE8"/></g><text x="74" y="183" class="group">AUTHORITY PLANE</text>
<g filter="url(#shadow)"><rect x="430" y="145" width="390" height="730" rx="18" fill="#FFFFFF" stroke="#D7DEE8"/></g><text x="454" y="183" class="group">PROJECT RESOLUTION</text>
<g filter="url(#shadow)"><rect x="860" y="145" width="340" height="730" rx="18" fill="#FFFFFF" stroke="#D7DEE8"/></g><text x="884" y="183" class="group">LOCAL DELIVERY</text>
<g filter="url(#shadow)"><rect x="1240" y="145" width="350" height="730" rx="18" fill="#FFFFFF" stroke="#D7DEE8"/></g><text x="1264" y="183" class="group">ENFORCEMENT AND EVIDENCE</text>
<polyline points="350,305 420,305 420,319 475,319" fill="none" stroke="#2F6BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-authority)"/>
<text x="410" y="295" text-anchor="middle" class="edge">select + pin</text>
<polyline points="350,595 405,595 405,377.5 475,377.5" fill="none" stroke="#2F6BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-authority)"/>
<polyline points="775,345 840,345 840,300 900,300" fill="none" stroke="#087F7B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-relationship)"/>
<text x="840" y="315" text-anchor="middle" class="edge">typed edges</text>
<polyline points="625,410 625,540 625,540 625,600" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-stop)"/>
<text x="690" y="520" text-anchor="middle" class="edge">validation</text>
<polyline points="1030,360 1030,545" fill="none" stroke="#087F7B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-relationship)"/>
<text x="1085" y="460" text-anchor="middle" class="edge">implements</text>
<polyline points="1160,300 1220,300 1220,303.75 1285,303.75" fill="none" stroke="#238636" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<polyline points="1160,605 1215,605 1215,353.75 1285,353.75" fill="none" stroke="#238636" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<polyline points="1415,385 1415,575" fill="none" stroke="#238636" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<text x="1480" y="500" text-anchor="middle" class="edge">effective context</text>
<g><rect x="90" y="245" width="260" height="120" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/><text x="110" y="287" class="label">Enterprise policy</text><text x="110" y="318" class="note">AI-007 · AI-030 · SEC-*</text></g>
<g><rect x="90" y="535" width="260" height="120" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/><text x="110" y="577" class="label">Domain policy</text><text x="110" y="608" class="note">UW-041 · owned by risk council</text></g>
<g><rect x="475" y="280" width="300" height="130" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/><text x="495" y="322" class="label">Policy-source manifest</text><text x="495" y="353" class="note">sources · versions · relationships</text></g>
<g><rect x="500" y="600" width="250" height="115" rx="14" fill="#FFF1DF" stroke="#D97706" stroke-width="2"/><text x="520" y="642" class="label">STOP states</text><text x="520" y="673" class="note">stale · weaker · unauthorized</text></g>
<g><rect x="900" y="240" width="260" height="120" rx="14" fill="#E5F7F6" stroke="#087F7B" stroke-width="2"/><text x="920" y="282" class="label">Project requirements</text><text x="920" y="313" class="note">specialize and implement</text></g>
<g><rect x="900" y="545" width="260" height="120" rx="14" fill="#E5F7F6" stroke="#087F7B" stroke-width="2"/><text x="920" y="587" class="label">Feature behavior</text><text x="920" y="618" class="note">observable acceptance boundary</text></g>
<g><rect x="1285" y="260" width="260" height="125" rx="14" fill="#E9F8ED" stroke="#238636" stroke-width="2"/><text x="1305" y="302" class="label">Machine controls</text><text x="1305" y="333" class="note">CI · infrastructure · runtime</text></g>
<g><rect x="1285" y="575" width="260" height="120" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/><text x="1305" y="617" class="label">Bounded coding agent</text><text x="1305" y="648" class="note">read context · protected writes</text></g>
</svg>