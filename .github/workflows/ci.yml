name: Validate course

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_course.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --check hub/lessons.js && node --check hub/app.js && node --check quiz/questions.js

